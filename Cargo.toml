[workspace]
resolver = "2"
members = ["crates/recon-core", "crates/frisk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/L-ubu/frisk"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
regex = "1"
